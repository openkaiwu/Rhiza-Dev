name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  blocking:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: rhiza
          POSTGRES_PASSWORD: rhiza
          POSTGRES_DB: rhiza_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rhiza -d rhiza_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://rhiza:rhiza@127.0.0.1:5432/rhiza_test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify M01 historical evidence chain
        run: pnpm exec tsx scripts/architecture-gates/verify-milestone-evidence.ts --milestone M01
      - name: Verify M02 blocking gate and committed evidence
        run: pnpm run verify:m02:v4
  observational:
    needs: blocking
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Capture G0 CI observation
        run: pnpm run g0:observe
      - name: Upload G0 CI observation
        uses: actions/upload-artifact@v4
        with:
          name: g0-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/g0-evidence.json
          if-no-files-found: error
          retention-days: 90
